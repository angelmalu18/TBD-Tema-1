spring.application.name=api-demo
server.port=8181

# Conexión a PostgreSQL (misma base que ves en DBeaver)
spring.datasource.url=jdbc:postgresql://localhost:5432/dbpersona
spring.datasource.username=postgres
# Si tu PostgreSQL pide contraseña, escríbela aquí
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: crea la tabla "personas" automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
